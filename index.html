<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>服装扫码入库系统</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e293b">
  
  <!-- 双源CDN确保库加载成功 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
    }
  </script>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (typeof XLSX === 'undefined') console.error('XLSX库加载失败');
        else console.log('XLSX库加载成功');
      }, 1000);
    });
  </script>
  
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #0f172a;
      --text-light: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.02);
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 24px; font-weight: 800; color: var(--primary); }
    .sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 16px; font-size: 14px; font-weight: 600; border: none;
      border-radius: 60px; cursor: pointer; transition: 0.2s; flex: 1;
      background: var(--card); color: var(--text); box-shadow: var(--shadow);
      min-width: fit-content;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
    .btn-danger { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); }
    .btn-sm { padding: 8px 14px; font-size: 12px; flex: none; }
    .switch-bar {
      background: var(--card); border-radius: 40px; padding: 8px 18px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .switch-label { font-size: 13px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
    .switch { position: relative; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; border-radius: 34px; transition: 0.2s; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }
    #reader { width: 100%; border-radius: 24px; overflow: hidden; margin: 8px 0; border: 2px solid var(--primary); display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .scan-status { text-align: center; font-size: 12px; color: var(--text-light); margin: 6px 0; }
    .close-scan { text-align: center; margin: 6px 0; display: none; }
    .card { background: var(--card); border-radius: 20px; padding: 20px; margin: 14px 0; box-shadow: var(--shadow); }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; }
    .form-grid { display: flex; flex-direction: column; gap: 14px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .input-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
    .input-field input, .input-field select { width: 100%; padding: 12px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 12px; background: white; transition: 0.2s; }
    .input-field input:focus, .input-field select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .input-field input[readonly] { background: #f1f5f9; color: #334155; }
    .check-row {display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--text-light);}
    .stats-grid { display: flex; gap: 12px; margin: 16px 0; }
    .stat-block { flex: 1; background: var(--card); padding: 14px; border-radius: 16px; text-align: center; box-shadow: var(--shadow); }
    .stat-number { font-size: 26px; font-weight: 800; color: var(--primary); }
    .section-header { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 12px; }
    .record-item { 
      background: var(--card); border-radius: 16px; padding: 16px; 
      margin-bottom: 10px; box-shadow: var(--shadow);
    }
    .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
    .barcode-chip { font-family: monospace; background: #eef2ff; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: 700; color: var(--primary); }
    .time-text { font-size: 10px; color: #94a3b8; }
    .detail-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 10px 0; }
    .detail-tag { background: #f8fafc; padding: 6px 8px; border-radius: 10px; font-size: 12px; text-align:center; }
    .detail-tag span:first-child { color: var(--text-light); margin-right: 4px; font-size:11px; }
    .record-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .empty-state { text-align: center; padding: 48px 20px; color: #94a3b8; }
    
    .summary-section { margin-bottom: 16px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
    .summary-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #f5f5f5; cursor: pointer;
      border-bottom: 1px solid #ddd;
    }
    .summary-header:hover { background: #eaeaea; }
    .summary-header .left { display: flex; align-items: center; gap: 8px; }
    .summary-header .arrow { transition: transform 0.2s; }
    .summary-header.open .arrow { transform: rotate(90deg); }
    .summary-body { display: none; background: #fff; }
    .summary-body.open { display: block; }
    .summary-row {
      display: grid; grid-template-columns: 2fr 1fr 1fr;
      padding: 10px 16px; border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .summary-total {
      display: grid; grid-template-columns: 2fr 1fr 1fr;
      padding: 10px 16px; background: #f0f0f0; font-weight: bold;
    }
    .detail-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      padding: 8px 16px; font-size: 12px; color: #666; background: #fafafa;
      border-top: 1px solid #eee;
    }
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: white; padding: 10px 20px; border-radius: 40px;
      font-size: 13px; font-weight: 500; z-index: 1100;
      animation: fadeOutUp 2.2s forwards; white-space: nowrap;
    }
    @keyframes fadeOutUp {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    .modal-mask { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
    .modal-mask.show { display: flex; }
    .summary-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .summary-tab { padding: 8px 20px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; flex: 1; text-align: center; }
    .summary-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .summary-row-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .summary-row-line.total { font-weight: 700; border-top: 2px solid var(--primary); margin-top: 4px; padding-top: 10px; }
    .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--card); cursor: pointer; font-size: 12px; font-weight: 500; transition: 0.2s; }
    .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
    .clear-confirm-input { width: 100%; padding: 10px; margin-top: 10px; border: 1.5px solid var(--danger); border-radius: 10px; font-size: 14px; text-align: center; outline: none; }
    .clear-confirm-input:focus { box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .modal-box { background: white; width: 300px; border-radius: 20px; padding: 24px; text-align: center; }
    .ocr-loading { position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 60px; z-index: 1200; font-size: 14px; }
    #ocrFileInput { display: none; }
    #imgUploadInput { display: none; }
    .img-full-modal {
      z-index: 2000;
      background: rgba(0,0,0,0.9);
    }
    .img-full-modal img {
      max-width: 90vw;
      max-height: 90vh;
    }
    .record-img-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
<div class="header">
  <h1>📦 服装扫码入库系统</h1>
  <div class="sub">扫码入库 | 拍照识别标签 | 连续扫码模式 | 款式照片上传</div>
</div>
<div class="btn-group">
  <button class="btn btn-primary" onclick="startSingleScan()" id="scanBtn">📷 扫码入库</button>
  <button class="btn btn-success" onclick="startContinuousScan()" id="continuousBtn">🔄 连续扫码入库</button>
  <button class="btn btn-warning" onclick="triggerOCRUpload()">📸 拍照识别标签</button>
  <button class="btn btn-outline" onclick="exportToExcel()">📎 导出Excel</button>
  <button class="btn btn-outline" onclick="exportToHtml()">🖼️ 导出HTML(含图)</button>
  <button class="btn btn-outline" onclick="triggerImportExcel()">📥 导入</button>
</div>
<input type="file" id="ocrFileInput" accept="image/*" capture="environment" onchange="handleOCRImage(event)">
<input type="file" id="importFileInput" accept=".xlsx,.xls" style="display:none" onchange="handleImportExcel(event)">
<!-- 款式图片上传input -->
<input type="file" id="imgUploadInput" accept="image/*" capture="environment" onchange="handleUploadStyleImg(event)">
<div class="switch-bar">
  <div class="switch-label">⚙️ 连续扫码时沿用配置</div>
  <label class="switch"><input type="checkbox" id="keepConfigSwitch" checked><span class="slider"></span></label>
</div>
<div class="scan-status" id="scanStatus"></div>
<div class="close-scan" id="closeScanArea">
  <button class="btn btn-outline btn-sm" onclick="stopScan(true)">✕ 关闭扫码器</button>
</div>
<div id="reader"></div>
<div class="card" id="formCard" style="display:none;">
  <div class="card-title">
    📝 入库明细
    <span class="badge" id="scannedBadge" style="display:none;">✓ 已识别</span>
  </div>
  <div class="form-grid">
    <div class="input-field"><label>🔖 条码ID</label><input type="text" id="barcodeId" readonly placeholder="扫码/识别后自动填充"></div>
    <!-- 新增：款式照片上传区域 -->
    <div class="img-upload-wrap" style="border:1.5px dashed var(--border);border-radius:12px;padding:12px;">
      <label style="font-size:11px;font-weight:700;color:var(--text-light);display:block;margin-bottom:8px;">👕 款式照片（可选）</label>
      <div class="img-preview-box" id="imgPreviewBox" style="width:100%;max-height:180px;border-radius:8px;overflow:hidden;margin-bottom:10px;display:none;">
        <img id="styleImgPreview" src="" alt="款式图" style="width:100%;height:auto;display:block;">
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm btn-outline" onclick="triggerStyleImgUpload()">📷 拍照/相册上传</button>
        <button class="btn btn-sm btn-danger" onclick="clearStyleImg()" id="delImgBtn" style="display:none;">删除图片</button>
      </div>
    </div>
    
    <div class="row-2">
      <div class="input-field">
        <label>季节</label>
        <select id="season">
          <option value="">请选择</option>
          <option value="春">春</option>
          <option value="夏">夏</option>
          <option value="秋">秋</option>
          <option value="冬">冬</option>
        </select>
      </div>
      <div class="input-field">
        <label>自编序号</label>
        <input type="text" id="sequenceNo" placeholder="手动输入数字/编号">
      </div>
    </div>
    <div class="input-field">
      <label>📏 尺码</label>
      <input list="sizeList" id="size" placeholder="选择或手动输入尺码">
      <datalist id="sizeList">
        <option value="XS"></option>
        <option value="S"></option>
        <option value="M"></option>
        <option value="L"></option>
        <option value="XL"></option>
        <option value="XXL"></option>
        <option value="XXXL"></option>
        <option value="XXXXL"></option>
        <option value="80"></option>
        <option value="90"></option>
        <option value="100"></option>
        <option value="110"></option>
        <option value="120"></option>
        <option value="130"></option>
        <option value="140"></option>
        <option value="150"></option>
        <option value="160"></option>
        <option value="170"></option>
        <option value="175"></option>
        <option value="180"></option>
      </datalist>
    </div>
    <div class="input-field"><label>🏷️ 工序名称</label><input type="text" id="processName" placeholder="如：查片/查披肩"></div>
    <div class="input-field"><label>👔 款号</label><input type="text" id="styleNo" placeholder="款号（如：Rxxxx）"></div>
    <div class="input-field">
      <label>📦 入库数量</label>
      <input type="number" id="stockNum" value="1" min="1" placeholder="自定义入库数量">
      <div class="check-row">
        <input type="checkbox" id="inheritStockNum" checked>
        <label>下次扫码继承该数量</label>
      </div>
    </div>
    <div class="row-2">
      <div class="input-field"><label>💰 单价</label><input type="number" id="price" value="0" min="0" step="0.01"></div>
      <div class="input-field"><label>💵 合计金额</label><input type="text" id="amount" readonly value="0.00"></div>
    </div>
    <div class="input-field"><label>⏱️ 入库时间</label><input type="text" id="inboundTime" readonly></div>
    <button class="btn btn-primary" onclick="submitInbound()" style="margin-top: 4px;">✅ 确认入库</button>
  </div>
</div>
<div class="stats-grid">
  <div class="stat-block"><div class="stat-number" id="statTotal">0</div><div>总件数</div></div>
  <div class="stat-block"><div class="stat-number" id="statBarcodes">0</div><div>唯一条码</div></div>
  <div class="stat-block"><div class="stat-number" id="statToday">0</div><div>今日入库</div></div>
</div>
<div class="section-header"><h3>📋 工序工资汇总（点击展开）</h3><span style="font-size:12px">按工序+款号统计</span></div>
<div id="processSummary" class="card" style="padding: 12px;"></div>
<div class="card" style="padding:16px;">
  <div class="card-title">📊 数据汇总</div>
  <div class="summary-tabs">
    <div class="summary-tab active" onclick="switchSummaryTab(this, 0)">今日</div>
    <div class="summary-tab" onclick="switchSummaryTab(this, 1)">本月</div>
    <div class="summary-tab" onclick="switchSummaryTab(this, 2)">今年</div>
  </div>
  <div id="summaryContent" style="min-height:60px;"></div>
</div>
<div class="section-header"><h3>📋 入库记录</h3><span id="recordCount">0 条</span></div>
<div class="filter-bar" id="filterBar">
  <div class="filter-chip active" onclick="switchDateFilter(7,this)">最近7天</div>
  <div class="filter-chip" onclick="switchDateFilter(0,this)">今日</div>
  <div class="filter-chip" onclick="switchDateFilter(30,this)">本月</div>
  <div class="filter-chip" onclick="switchDateFilter(-1,this)">全部</div>
</div>
<div id="history"></div>
<div style="display:flex; gap:12px; margin-top: 12px;">
  <button class="btn btn-warning" onclick="exportToExcel()" style="flex:1;">📥 导出 Excel</button>
  <button class="btn btn-outline btn-sm" onclick="clearTodayRecord()">🗑️ 清空本日</button>
  <button class="btn btn-danger btn-sm" onclick="showClearModal()">清空全部</button>
</div>
<!-- 图片全屏弹窗 -->
<div class="modal-mask img-full-modal" id="imgFullModal" onclick="closeImgModal()">
  <img id="fullImgSrc" src="" onclick="event.stopPropagation()" />
</div>
<div class="modal-mask" id="clearModal"><div class="modal-box"><h4>⚠️ 确认清空全部</h4><p>所有入库数据将永久删除，建议先导出Excel备份。</p><div class="btn-group" style="margin-top:8px;"><button class="btn btn-warning btn-sm" onclick="exportToExcel()" style="flex:1;">📥 先导出备份</button></div><input class="clear-confirm-input" id="clearConfirmInput" type="text" placeholder="请输入"确认删除"四个字" oninput="checkClearConfirm()" autocomplete="off"><p id="clearConfirmMsg" style="font-size:11px;color:var(--danger);margin-top:6px;display:none;">还需输入"确认删除"</p><div class="btn-group" style="margin-top:10px;"><button class="btn btn-outline btn-sm" onclick="hideClearModal()">取消</button><button class="btn btn-danger btn-sm" id="clearConfirmBtn" onclick="clearAll()" disabled style="opacity:0.5;">确认清空</button></div></div></div>
<div class="modal-mask" id="todayClearModal"><div class="modal-box"><h4>⚠️ 确认清空本日</h4><p>仅删除今天入库记录，保留历史数据。</p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="hideTodayClearModal()">取消</button><button class="btn btn-warning btn-sm" onclick="clearToday()">确认清空本日</button></div></div></div>
<div class="modal-mask" id="dupModal"><div class="modal-box"><h4>⚠️ 条码重复</h4><p id="dupMsg"></p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-success btn-sm" onclick="dupContinue()">继续新增</button><button class="btn btn-primary btn-sm" onclick="dupReplace()">覆盖数据</button></div></div></div>
<div class="modal-mask" id="importModal"><div class="modal-box"><h4>📥 导入数据</h4><p id="importMsg">检测到 <strong id="importCount">0</strong> 条数据</p><p style="font-size:12px;color:var(--text-light);margin-top:8px;">请选择导入方式</p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-success btn-sm" onclick="importMerge()">合并导入</button><button class="btn btn-warning btn-sm" onclick="importOverwrite()">覆盖导入</button><button class="btn btn-outline btn-sm" onclick="hideImportModal()">取消</button></div></div></div>
<script>
  let html5QrCode = null;
  let records = [];
  let editingIndex = -1;
  let lastStockNum = 1;
  let isContinuousMode = false;
  let currentDupBarcode = '';
  let ocrWorker = null;
  let pendingImportData = [];
  // 全局存储当前表单图片base64
  let currentStyleImgBase64 = '';
  // ========== 图片上传相关函数 【全部修复】 ==========
  function triggerStyleImgUpload() {
    document.getElementById('imgUploadInput').value = '';
    document.getElementById('imgUploadInput').click();
  }
  function clearStyleImg() {
    currentStyleImgBase64 = '';
    document.getElementById('styleImgPreview').src = '';
    document.getElementById('imgPreviewBox').style.display = 'none';
    document.getElementById('delImgBtn').style.display = 'none';
  }
  function handleUploadStyleImg(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      // 压缩图片
      compressImage(e.target.result, 800, 800, (base64) => {
        currentStyleImgBase64 = base64;
        document.getElementById('styleImgPreview').src = base64;
        document.getElementById('imgPreviewBox').style.display = 'block';
        document.getElementById('delImgBtn').style.display = 'inline-flex';
      })
    }
    reader.readAsDataURL(file);
    document.getElementById('imgUploadInput').value = '';
  }
  function compressImage(base64Str, maxWidth, maxHeight, callback) {
    const img = new Image();
    img.src = base64Str;
    img.onerror = function() { callback(base64Str); };
    img.onload = function() {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      if (h > maxHeight) { w = w * maxHeight / h; h = maxHeight; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const resBase64 = canvas.toDataURL('image/jpeg', 0.6);
      callback(resBase64);
    };
  }

  async function handleOCRImage(event) {
    const file = event.target.files[0];
    if(!file) return;
    showToast("🔍 AI识别中，请稍候...");
    let loadingDiv = document.createElement('div');
    loadingDiv.className = 'ocr-loading';
    loadingDiv.innerText = '📖 正在识别服装标签...';
    document.body.appendChild(loadingDiv);
    try {
      const processedBlob = await preprocessImage(file);
      let result;
      if (ocrWorker) { const { data } = await ocrWorker.recognize(processedBlob); result = data; }
      else { result = await Tesseract.recognize(processedBlob, 'chi_sim+eng'); }
      const rawText = result.text;
      const parsed = parseGarmentLabel(rawText);
      
      if(!parsed.barcodeId && !parsed.styleNo && !parsed.size) {
        if(confirm("识别内容较少，是否仍然使用？")) { fillFromOCRData(parsed); } else { triggerOCRUpload(); }
      } else {
        fillFromOCRData(parsed);
        showToast("✅ 标签识别成功");
        document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
      }
    } catch(err) {
      showToast("❌ 识别失败");
    } finally {
      document.body.removeChild(loadingDiv);
      document.getElementById('ocrFileInput').value = '';
    }
  }
  
  function preprocessImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      img.onload = () => {
        canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0,0,canvas.width,canvas.height); const data = imageData.data;
        for (let i=0;i<data.length;i+=4) { const gray = data[i]*0.3+data[i+1]*0.59+data[i+2]*0.11; const bw = gray>140?255:0; data[i]=data[i+1]=data[i+2]=bw; }
        ctx.putImageData(imageData,0,0); canvas.toBlob(resolve,'image/png');
      };
      img.src = URL.createObjectURL(file);
    });
  }
  function parseGarmentLabel(text) {
    let result = { barcodeId: '', size: '', styleNo: '' };
    let barcodeMatch = text.match(/\b\d{10,22}\b/); if(barcodeMatch) result.barcodeId = barcodeMatch[0];
    let sizeMatch = text.match(/(XS|S|M|L|XL|XXL|XXXL|XXXXL|80|90|100|110|120|130|140|150|160)/gi); 
    if(sizeMatch) result.size = sizeMatch[0].toUpperCase();
    let styleReg = /(款号|货号|款)[：:；;,，\s]*([A-Z0-9\-]{3,})/; let sm = text.match(styleReg); if(sm) result.styleNo = sm[2].trim();
    return result;
  }

    ];
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet(detailData);
    const ws2 = XLSX.utils.aoa_to_sheet(summaryData);
    const ws3 = XLSX.utils.aoa_to_sheet(imgIndexData);

      const blob = new Blob([data], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

    html += 'img.thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;display:block}';
    html += '.no-img{color:#94a3b8;font-size:11px;font-style:italic}';
    html += '.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:30px;padding:20px}';
    html += '@media print{body{background:#fff}table{box-shadow:none}.stats{box-shadow:none}}';
    html += '</style></head><body>';
    
    // 统计信息
    const totalQty = records.reduce((s,r) => s + (Number(r.stockNum)||1), 0);
    const totalAmount = records.reduce((s,r) => s + (parseFloat(r.amount)||0), 0);
    const totalOrders = records.length;
    const totalCodes = new Set(records.map(r=>r.barcodeId)).size;
    html += '<h1>📊 服装入库报告</h1>';
    html += '<div class="stats"><div class="stats-grid">';
    html += '<div class="stat-item"><span class="num">'+totalOrders+'</span><span class="lbl">入库单数</span></div>';
    html += '<div class="stat-item"><span class="num">'+totalCodes+'</span><span class="lbl">唯一条码</span></div>';
    html += '<div class="stat-item"><span class="num">'+totalQty+'</span><span class="lbl">入库数量</span></div>';
    html += '<div class="stat-item"><span class="num">¥'+totalAmount.toFixed(2)+'</span><span class="lbl">总金额</span></div>';
    html += '</div></div>';
    
    // 表格
    html += '<table><thead><tr>';
    html += '<th>序号</th><th>入库时间</th><th>条码</th><th>款号</th><th>尺码</th><th>工序</th><th>数量</th><th>单价</th><th>金额</th><th>款式图片</th>';
    html += '</tr></thead><tbody>';
    
    let imgWarn = false;
    records.forEach((r, i) => {
      const idx = i + 1;
      const hasImg = !!(r.imgBase64 && r.imgBase64.length > 100);
      if(hasImg) imgWarn = true;
      html += '<tr>';
      html += '<td>'+idx+'</td>';
      html += '<td>'+(r.inboundTime||'')+'</td>';
      html += '<td>'+(r.barcodeId||'')+'</td>';
      html += '<td>'+(r.styleNo||'')+'</td>';
      html += '<td>'+(r.size||'')+'</td>';
      html += '<td>'+(r.processName||'')+'</td>';
      html += '<td>'+(r.stockNum||'')+'</td>';
      html += '<td>¥'+(parseFloat(r.price).toFixed(2))+'</td>';
      html += '<td>¥'+(parseFloat(r.amount).toFixed(2))+'</td>';
      html += '<td>';
      if(hasImg) {
        html += '<img class="thumb" src="'+r.imgBase64+'" alt="款式图" onclick="window.open(this.src)">';
      } else {
        html += '<span class="no-img">无图片</span>';
      }
      html += '</td></tr>';
    });
    
    html += '</tbody></table>';
    if(imgWarn) {
      html += '<p style="font-size:11px;color:#94a3b8;margin-top:8px;text-align:right">💡 点击图片可查看大图</p>';
    }
    html += '<div class="footer">报告生成时间: '+new Date().toLocaleString('zh-CN')+' | 服装扫码入库系统</div>';
    html += '</body></html>';
    
    // 下载
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '服装入库报告_' + new Date().toLocaleDateString('zh-CN').replace(/\//g, '-') + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✅ HTML报告导出成功（图片已内嵌）');
  }
function triggerImportExcel() {
    if(html5QrCode) stopScan(true);
    document.getElementById('importFileInput').value = '';
    document.getElementById('importFileInput').click();
  }
  
  function hideImportModal() {
    document.getElementById('importModal').classList.remove('show');
    pendingImportData = [];
  }
  
  function handleImportExcel(event) {
    const file = event.target.files[0];
    if(!file) return;
    
    showToast('🔍 正在解析Excel...');
    const reader = new FileReader();
    
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        // 读取第一个工作表（入库明细）
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
        
        // 解析并转换数据格式
        const importedRecords = [];
        jsonData.forEach((row, idx) => {
          // 跳过小计行和空行
          if(!row['入库时间'] || String(row['入库时间']).includes('小计')) return;
          
          // 生成条码ID（如果没有，用时间戳+索引）
          let barcodeId = row['条码ID'] || row['条码'] || '';
          if(!barcodeId) barcodeId = 'IMP' + Date.now() + idx;
          
          const record = {
            id: Date.now() + idx,
            barcodeId: String(barcodeId),
            season: row['季节'] || '',
            sequenceNo: row['自编序号'] || row['序号'] || '',
            size: String(row['尺码'] || ''),
            processName: String(row['工序名称'] || row['工序'] || '未指定工序'),
            styleNo: String(row['款号'] || ''),
            stockNum: parseFloat(row['入库数量']) || 1,
            price: parseFloat(row['单价(¥)'] || row['单价']) || 0,
            amount: parseFloat(row['金额(¥)'] || row['金额']) || 0,
            inboundTime: String(row['入库时间'] || new Date().toLocaleString('zh-CN')),
            imgBase64: '' // 导入不再读取图片，防止卡顿溢出
          };
          
          // 重新计算金额确保正确
          record.amount = (record.stockNum * record.price).toFixed(2) * 1;
          importedRecords.push(record);
        });
        
        if(importedRecords.length === 0) {
          showToast('❌ 未找到有效数据');
          return;
        }
        
        pendingImportData = importedRecords;
        document.getElementById('importCount').textContent = importedRecords.length;
        document.getElementById('importModal').classList.add('show');
        
      } catch(err) {
        console.error(err);
        showToast('❌ 解析失败，请检查文件格式');
      }
    };
    
    reader.readAsArrayBuffer(file);
    document.getElementById('importFileInput').value = '';
  }
  
  function importMerge() {
    // 合并：保留原有数据，追加新数据
    records = [...pendingImportData, ...records];
    saveRecords();
    sortByTime();
    renderAll();
    hideImportModal();
    showToast(`✅ 成功导入 ${pendingImportData.length} 条数据（合并模式）`);
  }
  
  function importOverwrite() {
    // 覆盖：清空原有数据，只保留导入的数据
    records = pendingImportData;
    saveRecords();
    sortByTime();
    renderAll();
    hideImportModal();
    showToast(`✅ 成功导入 ${pendingImportData.length} 条数据（覆盖模式）`);
  }
  function showClearModal(){ document.getElementById('clearModal').classList.add('show'); }
  function hideClearModal(){ document.getElementById('clearModal').classList.remove('show'); }
  function clearAll(){ records=[]; saveRecords(); renderAll(); hideClearModal(); document.getElementById('clearConfirmInput').value=''; document.getElementById('clearConfirmBtn').disabled=true; document.getElementById('clearConfirmBtn').style.opacity='0.5'; showToast('已清空所有数据'); }
  function showToast(msg){ let t=document.createElement('div');t.className='toast';t.innerText=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200); }
  function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m); }
  
  function loadRecords(){
    try{
      const saved = localStorage.getItem('garmentRecords');
      if(saved) records = JSON.parse(saved);
    }catch(e){ records = []; }
    // 读取后过滤超大图片 (深拷贝避免后续引用问题)
    records = records.map(r => {
      const copy = {...r};
      if(copy.imgBase64 && copy.imgBase64.length > 150000) {
        copy.imgBase64 = '';
      }
      return copy;
    })
  }function saveRecords(){
    // 存储前过滤超大图片，避免localStorage溢出 (深拷贝避免修改原数据)
    const saveList = records.map(r => {
      const copy = {...r};
      if(copy.imgBase64 && copy.imgBase64.length > 150000) {
        copy.imgBase64 = '';
      }
      return copy;
    })
    localStorage.setItem('garmentRecords', JSON.stringify(saveList));
  }function sortByTime(){
    records.sort((a,b) => new Date(b.inboundTime) - new Date(a.inboundTime));
  }
  function switchDateFilter(days, el){
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    renderHistory(days);
  }
  function switchSummaryTab(el, type){
    document.querySelectorAll('.summary-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    renderSummary(type);
  }
  function renderSummary(type){
    const now = new Date();
    let filtered = records;
    if(type === 0){
      const today = now.toLocaleDateString('zh-CN');
      filtered = records.filter(r=>r.inboundTime?.includes(today));
    }else if(type === 1){
      const month = now.getMonth();
      const year = now.getFullYear();
      filtered = records.filter(r=>{
        const d = new Date(r.inboundTime);
        return d.getMonth() === month && d.getFullYear() === year;
      });
    }else if(type === 2){
      const year = now.getFullYear();
      filtered = records.filter(r=>{
        const d = new Date(r.inboundTime);
        return d.getFullYear() === year;
      });
    }
    const totalQty = filtered.reduce((s,r)=>s+(Number(r.stockNum)||1),0);
    const totalAmount = filtered.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    const totalOrders = filtered.length;
    const avgPrice = totalQty > 0 ? (totalAmount/totalQty).toFixed(2) : 0;
    const html = `
      <div class="summary-row-line"><span>入库单数</span><span>${totalOrders} 单</span></div>
      <div class="summary-row-line"><span>入库数量</span><span>${totalQty} 件</span></div>
      <div class="summary-row-line"><span>总金额</span><span>¥ ${totalAmount.toFixed(2)}</span></div>
      <div class="summary-row-line total"><span>平均单价</span><span>¥ ${avgPrice}/件</span></div>
    `;
    document.getElementById('summaryContent').innerHTML = html;
  }
  function renderHistory(days=7){
    let filtered = records;
    if(days >= 0){
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - days);
      cutoff.setHours(0,0,0,0);
      filtered = records.filter(r=>new Date(r.inboundTime) >= cutoff);
    }
    document.getElementById('recordCount').textContent = filtered.length + ' 条';
    if(filtered.length === 0){
      document.getElementById('history').innerHTML = '<div class="empty-state">暂无入库记录</div>';
      return;
    }
    let html = '';
    filtered.forEach((r,i)=>{
      // 图片缩略图 修复Base64引号转义报错
      let thumbHtml = '';
      if(r.imgBase64) {
        const safeImg = safeBase64Encode(r.imgBase64);
        thumbHtml = `<img class="record-img-thumb" src="${r.imgBase64}" onclick="openImgModal('${safeImg}')" alt="款式图">`;
      }
      html += `
      <div class="record-item">
        <div class="record-header">
          <span class="barcode-chip">${escapeHtml(r.barcodeId)}</span>
          ${thumbHtml}
          <span class="time-text">${r.inboundTime}</span>
        </div>
        <div class="detail-grid">
          <div class="detail-tag"><span>款号</span>${escapeHtml(r.styleNo)}</div>
          <div class="detail-tag"><span>尺码</span>${escapeHtml(r.size||'-')}</div>
          <div class="detail-tag"><span>数量</span>${r.stockNum}</div>
          <div class="detail-tag"><span>工序</span>${escapeHtml(r.processName)}</div>
          <div class="detail-tag"><span>单价</span>¥${parseFloat(r.price).toFixed(2)}</div>
          <div class="detail-tag"><span>金额</span>¥${parseFloat(r.amount).toFixed(2)}</div>
        </div>
        <div class="record-actions">
          <button class="btn btn-outline btn-sm" onclick="modifyRecord(${i})">✏️ 修改</button>
        </div>
      </div>`;
    });
    document.getElementById('history').innerHTML = html;
  }
  function checkClearConfirm(){
    const val = document.getElementById('clearConfirmInput').value;
    const btn = document.getElementById('clearConfirmBtn');
    const msg = document.getElementById('clearConfirmMsg');
    if(val === '确认删除'){
      btn.disabled = false;
      btn.style.opacity = '1';
      msg.style.display = 'none';
    }else{
      btn.disabled = true;
      btn.style.opacity = '0.5';
      msg.style.display = 'block';
    }
  }
  function renderAll(){
    renderStats();
    renderProcessSummary();
    renderSummary(0);
    renderHistory(7);
  }
  
  window.addEventListener('beforeinstallprompt', e=>e.preventDefault());
  loadRecords(); bindCalcEvents(); bindStyleEvent(); bindSequenceNoEvent();
</script>
