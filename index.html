<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>服装扫码入库系统</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="扫码入库">
  <meta name="theme-color" content="#1e293b">
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #0f172a;
      --text-light: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.02);
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 24px; font-weight: 800; color: var(--primary); }
    .sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 16px; font-size: 14px; font-weight: 600; border: none;
      border-radius: 60px; cursor: pointer; transition: 0.2s; flex: 1;
      background: var(--card); color: var(--text); box-shadow: var(--shadow);
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
    .btn-danger { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); }
    .btn-sm { padding: 8px 14px; font-size: 12px; flex: none; }
    .switch-bar {
      background: var(--card); border-radius: 40px; padding: 8px 18px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .switch-label { font-size: 13px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
    .switch { position: relative; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; border-radius: 34px; transition: 0.2s; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    #reader { width: 100%; border-radius: 24px; overflow: hidden; margin: 8px 0; border: 2px solid var(--primary); display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .scan-status { text-align: center; font-size: 12px; color: var(--text-light); margin: 6px 0; }
    .close-scan { text-align: center; margin: 6px 0; display: none; }

    .card { background: var(--card); border-radius: 20px; padding: 20px; margin: 14px 0; box-shadow: var(--shadow); }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; }
    .form-grid { display: flex; flex-direction: column; gap: 14px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .input-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
    .input-field input, .input-field select { width: 100%; padding: 12px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 12px; background: white; transition: 0.2s; }
    .input-field input:focus, .input-field select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .input-field input[readonly] { background: #f1f5f9; color: #334155; }

    .stats-grid { display: flex; gap: 12px; margin: 16px 0; }
    .stat-block { flex: 1; background: var(--card); padding: 14px; border-radius: 16px; text-align: center; box-shadow: var(--shadow); }
    .stat-number { font-size: 26px; font-weight: 800; color: var(--primary); }
    .section-header { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 12px; }
    .record-item { 
      background: var(--card); border-radius: 16px; padding: 16px; 
      margin-bottom: 10px; box-shadow: var(--shadow);
    }
    .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
    .barcode-chip { font-family: monospace; background: #eef2ff; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: 700; color: var(--primary); }
    .time-text { font-size: 10px; color: #94a3b8; }
    .detail-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 10px 0; }
    .detail-tag { background: #f8fafc; padding: 6px 8px; border-radius: 10px; font-size: 12px; text-align:center; }
    .detail-tag span:first-child { color: var(--text-light); margin-right: 4px; font-size:11px; }
    .record-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .empty-state { text-align: center; padding: 48px 20px; color: #94a3b8; }
    .month-summary { background: #f1f5f9; border-radius: 12px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: white; padding: 10px 20px; border-radius: 40px;
      font-size: 13px; font-weight: 500; z-index: 1100;
      animation: fadeOutUp 2.2s forwards; white-space: nowrap;
    }
    @keyframes fadeOutUp {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    .modal-mask { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
    .modal-mask.show { display: flex; }
    .modal-box { background: white; width: 300px; border-radius: 20px; padding: 24px; text-align: center; }
    .ocr-loading { position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 60px; z-index: 1200; font-size: 14px; }
    #ocrFileInput { display: none; }
  </style>
</head>
<body>

<div class="header">
  <h1>📦 服装扫码入库系统</h1>
  <div class="sub">扫码入库 | 拍照识别标签 | 连续扫码模式</div>
</div>

<div class="btn-group">
  <button class="btn btn-primary" onclick="startSingleScan()" id="scanBtn">📷 扫码入库</button>
  <button class="btn btn-success" onclick="startContinuousScan()" id="continuousBtn">🔄 连续扫码入库</button>
  <button class="btn btn-warning" onclick="triggerOCRUpload()">📸 拍照识别标签</button>
  <button class="btn btn-outline" onclick="exportToExcel()">📎 导出</button>
</div>
<input type="file" id="ocrFileInput" accept="image/*" capture="environment" onchange="handleOCRImage(event)">

<div class="switch-bar">
  <div class="switch-label">⚙️ 连续扫码时沿用配置</div>
  <label class="switch"><input type="checkbox" id="keepConfigSwitch" checked><span class="slider"></span></label>
</div>

<div class="scan-status" id="scanStatus"></div>
<div class="close-scan" id="closeScanArea">
  <button class="btn btn-outline btn-sm" onclick="stopScan(true)">✕ 关闭扫码器</button>
</div>
<div id="reader"></div>

<div class="card" id="formCard" style="display:none;">
  <div class="card-title">
    📝 入库明细
    <span class="badge" id="scannedBadge" style="display:none;">✓ 已识别</span>
  </div>
  <div class="form-grid">
    <div class="input-field"><label>🔖 条码ID</label><input type="text" id="barcodeId" readonly placeholder="扫码/识别后自动填充"></div>
    
    <div class="row-2">
      <div class="input-field">
        <label>季节</label>
        <select id="season">
          <option value="">请选择</option>
          <option value="春">春</option>
          <option value="夏">夏</option>
          <option value="秋">秋</option>
          <option value="冬">冬</option>
        </select>
      </div>
      <div class="input-field">
        <label>自编序号</label>
        <input type="text" id="sequenceNo" placeholder="手动输入数字/编号">
      </div>
    </div>

    <!-- 尺码：真正下拉选择框，自动填充后依然可改 -->
    <div class="input-field">
      <label>📏 尺码</label>
      <select id="size">
        <option value="">请选择尺码</option>
        <option value="XS">XS</option>
        <option value="S">S</option>
        <option value="M">M</option>
        <option value="L">L</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option>
        <option value="XXXL">XXXL</option>
        <option value="XXXXL">XXXXL</option>
        <option value="80">80</option>
        <option value="90">90</option>
        <option value="100">100</option>
        <option value="110">110</option>
        <option value="120">120</option>
        <option value="130">130</option>
        <option value="140">140</option>
        <option value="150">150</option>
        <option value="160">160</option>
        <option value="170">170</option>
        <option value="175">175</option>
        <option value="180">180</option>
      </select>
    </div>

    <div class="input-field"><label>🏷️ 扎号</label><input type="text" id="bundleNo" placeholder="捆号/扎号"></div>
    <div class="input-field"><label>👔 款号</label><input type="text" id="styleNo" placeholder="款号"></div>
    <div class="row-2">
      <div class="input-field"><label>📊 自定义数量</label><input type="number" id="quantity" value="1" min="1"></div>
      <div class="input-field"><label>💰 单价</label><input type="number" id="price" value="0" min="0" step="0.01"></div>
    </div>
    <div class="input-field">
      <label>💵 合计金额</label>
      <input type="text" id="amount" readonly value="0.00">
    </div>
    <div class="input-field"><label>⏱️ 入库时间</label><input type="text" id="inboundTime" readonly></div>
    <button class="btn btn-primary" onclick="submitInbound()" style="margin-top: 4px;">✅ 确认入库</button>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-block"><div class="stat-number" id="statTotal">0</div><div>总件数</div></div>
  <div class="stat-block"><div class="stat-number" id="statBarcodes">0</div><div>唯一条码</div></div>
  <div class="stat-block"><div class="stat-number" id="statToday">0</div><div>今日入库</div></div>
</div>

<div class="section-header"><h3>📅 月度汇总</h3><span style="font-size:12px">按月份统计</span></div>
<div id="monthSummary" class="card" style="padding: 12px;"></div>

<div class="section-header"><h3>📋 入库记录</h3><span id="recordCount">0 条</span></div>
<div id="history"></div>

<div style="display:flex; gap:12px; margin-top: 12px;">
  <button class="btn btn-warning" onclick="exportToExcel()" style="flex:1;">📥 导出 Excel</button>
  <button class="btn btn-outline btn-sm" onclick="clearTodayRecord()">🗑️ 清空本日</button>
  <button class="btn btn-danger btn-sm" onclick="showClearModal()">清空全部</button>
</div>

<div class="modal-mask" id="clearModal"><div class="modal-box"><h4>⚠️ 确认清空全部</h4><p>所有入库数据将永久删除，建议先导出备份。</p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="hideClearModal()">取消</button><button class="btn btn-danger btn-sm" onclick="clearAll()">确认清空</button></div></div></div>
<div class="modal-mask" id="todayClearModal"><div class="modal-box"><h4>⚠️ 确认清空本日</h4><p>仅删除今天入库记录，保留历史月度数据。</p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="hideTodayClearModal()">取消</button><button class="btn btn-warning btn-sm" onclick="clearToday()">确认清空本日</button></div></div></div>
<div class="modal-mask" id="dupModal"><div class="modal-box"><h4>⚠️ 条码重复</h4><p id="dupMsg"></p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-success btn-sm" onclick="dupContinue()">继续新增</button><button class="btn btn-primary btn-sm" onclick="dupReplace()">覆盖数据</button></div></div></div>

<script>
  let html5QrCode = null;
  let records = [];
  let editingIndex = -1;
  let lastConfig = {};
  let isContinuousMode = false;
  let currentDupBarcode = '';
  let ocrWorker = null;

  function calcAmount(){
    let qty = parseFloat(document.getElementById('quantity').value) || 0;
    let price = parseFloat(document.getElementById('price').value) || 0;
    let amt = (qty * price).toFixed(2);
    document.getElementById('amount').value = amt;
  }
  function bindCalcEvents(){
    const qty = document.getElementById('quantity');
    const price = document.getElementById('price');
    qty.addEventListener('input', calcAmount);
    qty.addEventListener('change', calcAmount);
    qty.addEventListener('blur', calcAmount);
    price.addEventListener('input', calcAmount);
    price.addEventListener('change', calcAmount);
    price.addEventListener('blur', calcAmount);
  }

  function fillByStyle(){
    let style = document.getElementById('styleNo').value.trim();
    if(!style) return;
    let last = records.filter(r=>r.styleNo===style).sort((a,b)=>new Date(b.inboundTime)-new Date(a.inboundTime))[0];
    if(!last) return;
    document.getElementById('price').value = last.price || 0;
    document.getElementById('bundleNo').value = last.bundleNo || '';
    calcAmount();
    showToast('✅ 同款信息已自动填充');
  }
  function bindStyleEvent(){
    const style = document.getElementById('styleNo');
    style.addEventListener('input', fillByStyle);
    style.addEventListener('change', fillByStyle);
    style.addEventListener('blur', fillByStyle);
  }

  (async function preloadOCR() {
    try {
      ocrWorker = await Tesseract.createWorker();
      await ocrWorker.loadLanguage('eng+chi_sim');
      await ocrWorker.initialize('eng+chi_sim');
    } catch(e) {}
  })();

  const getTodayStr = () => new Date().toISOString().slice(0,10);
  const getTodayCN = () => new Date().toLocaleDateString('zh-CN');
  
  function refreshSeqSelect() {}
  function initSequenceSelect() {}

  function saveCurrentConfig() {
    lastConfig = {
      season: document.getElementById('season').value,
      sequenceNo: document.getElementById('sequenceNo').value,
      size: document.getElementById('size').value,
      bundleNo: document.getElementById('bundleNo').value,
      styleNo: document.getElementById('styleNo').value,
      quantity: document.getElementById('quantity').value,
      price: document.getElementById('price').value
    };
  }
  
  function applyLastConfigContinuous() {
    if(!document.getElementById('keepConfigSwitch').checked) return;
    const fields = ['season','size','bundleNo','styleNo','quantity','price'];
    fields.forEach(k => { let el = document.getElementById(k); if(el && lastConfig[k] !== undefined) el.value = lastConfig[k]; });
    calcAmount();
  }

  function triggerOCRUpload() { 
    if(html5QrCode) stopScan(true);
    document.getElementById('ocrFileInput').click(); 
  }
  
  async function handleOCRImage(event) {
    const file = event.target.files[0];
    if(!file) return;
    showToast("🔍 AI识别中，请稍候...");
    let loadingDiv = document.createElement('div');
    loadingDiv.className = 'ocr-loading';
    loadingDiv.innerText = '📖 正在识别服装标签...';
    document.body.appendChild(loadingDiv);
    try {
      const processedBlob = await preprocessImage(file);
      let result;
      if (ocrWorker) { const { data } = await ocrWorker.recognize(processedBlob); result = data; }
      else { result = await Tesseract.recognize(processedBlob, 'chi_sim+eng'); }
      const rawText = result.text;
      const parsed = parseGarmentLabel(rawText);
      
      if(!parsed.barcodeId && !parsed.styleNo && !parsed.size) {
        if(confirm("识别内容较少，是否仍然使用？")) { fillFromOCRData(parsed); } else { triggerOCRUpload(); }
      } else {
        fillFromOCRData(parsed);
        showToast("✅ 标签识别成功");
        document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
      }
    } catch(err) {
      showToast("❌ 识别失败");
    } finally {
      document.body.removeChild(loadingDiv);
      document.getElementById('ocrFileInput').value = '';
    }
  }
  
  function preprocessImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      img.onload = () => {
        canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0,0,canvas.width,canvas.height); const data = imageData.data;
        for (let i=0;i<data.length;i+=4) { const gray = data[i]*0.3+data[i+1]*0.59+data[i+2]*0.11; const bw = gray>140?255:0; data[i]=data[i+1]=data[i+2]=bw; }
        ctx.putImageData(imageData,0,0); canvas.toBlob(resolve,'image/png');
      };
      img.src = URL.createObjectURL(file);
    });
  }

  function parseGarmentLabel(text) {
    let result = { barcodeId: '', size: '', bundleNo: '', styleNo: '' };
    let barcodeMatch = text.match(/\b\d{10,22}\b/); if(barcodeMatch) result.barcodeId = barcodeMatch[0];
    let sizeMatch = text.match(/(XS|S|M|L|XL|XXL|XXXL|XXXXL|80|90|100|110|120|130|140|150|160)/gi); 
    if(sizeMatch) result.size = sizeMatch[0].toUpperCase();
    let bundleReg = /(扎号|捆号|扎|捆)[：:；;,，\s]*([A-Z0-9\-]+)/; let bm = text.match(bundleReg); if(bm) result.bundleNo = bm[2].trim();
    let styleReg = /(款号|货号|款)[：:；;,，\s]*([A-Z0-9\-]{3,})/; let sm = text.match(styleReg); if(sm) result.styleNo = sm[2].trim();
    return result;
  }

  function fillFromOCRData(data) {
    if(data.barcodeId) document.getElementById('barcodeId').value = data.barcodeId;
    if(data.size) document.getElementById('size').value = data.size;
    document.getElementById('bundleNo').value = data.bundleNo || '';
    document.getElementById('styleNo').value = data.styleNo || '';
    document.getElementById('quantity').value = 1;
    document.getElementById('price').value = 0;
    calcAmount();
    document.getElementById('inboundTime').value = new Date().toLocaleString('zh-CN');
    document.getElementById('scannedBadge').style.display = 'inline-block';
    editingIndex = -1;
    document.getElementById('formCard').style.display = 'block';
    if(data.styleNo) fillByStyle();
  }

  function fillScanBarcode(barcode){
    document.getElementById('barcodeId').value = barcode;
    document.getElementById('scannedBadge').style.display = 'inline-block';
    document.getElementById('inboundTime').value = new Date().toLocaleString('zh-CN');
    editingIndex = -1;
    let oldStyle = document.getElementById('styleNo').value.trim();

    bindCalcEvents(); bindStyleEvent();

    if(isContinuousMode && document.getElementById('keepConfigSwitch').checked){ applyLastConfigContinuous(); }

    let newStyle = document.getElementById('styleNo').value.trim();
    if(newStyle && newStyle!==oldStyle) fillByStyle();
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('formCard').scrollIntoView({behavior:'smooth'});
    if(navigator.vibrate) navigator.vibrate(50);
    showToast("✅ 扫码成功");
  }
  
  async function stopCameraOnly() {
    if(html5QrCode){ try{ await html5QrCode.stop(); }catch(e){} html5QrCode = null; }
    document.getElementById('reader').style.display = 'none';
    document.getElementById('scanBtn').style.display = 'block';
    document.getElementById('continuousBtn').style.display = 'block';
    document.getElementById('closeScanArea').style.display = 'none';
    document.getElementById('scanStatus').textContent = '';
  }
  
  function stopScan(resetContinuous = true) {
    if(resetContinuous) isContinuousMode = false;
    if(html5QrCode){ try{ html5QrCode.stop(); }catch(e){} html5QrCode = null; }
    document.getElementById('reader').style.display = 'none';
    document.getElementById('scanBtn').style.display = 'block';
    document.getElementById('continuousBtn').style.display = 'block';
    document.getElementById('closeScanArea').style.display = 'none';
    document.getElementById('scanStatus').textContent = '';
  }
  
  async function startSingleScan() {
    isContinuousMode = false; await startScanInternal();
  }
  async function startContinuousScan() {
    isContinuousMode = true; editingIndex = -1; showToast('🔄 连续扫码模式开启'); await startScanInternal();
  }
  
  async function startScanInternal() {
    if(html5QrCode) try{ await html5QrCode.stop(); }catch(e){}
    document.getElementById('reader').innerHTML = '';
    document.getElementById('reader').style.display = 'block';
    document.getElementById('scanBtn').style.display = 'none';
    document.getElementById('continuousBtn').style.display = 'none';
    document.getElementById('closeScanArea').style.display = 'block';
    document.getElementById('scanStatus').textContent = '📷 请求摄像头...';
    html5QrCode = new Html5Qrcode("reader");
    try {
      await html5QrCode.start({ facingMode:"environment" }, { fps:10, qrbox:{width:280,height:200} }, onScanSuccess, ()=>{});
      document.getElementById('scanStatus').textContent = '🔍 扫描中，对准条码';
    } catch(e){ showToast("❌ 摄像头启动失败"); stopScan(true); }
  }
  
  async function onScanSuccess(text) {
    await stopCameraOnly();
    let barcode = text.trim(); currentDupBarcode = barcode;
    let exist = records.findIndex(r => r.barcodeId === barcode);
    if(exist !== -1){ document.getElementById('dupMsg').innerHTML = `条码 <strong>${barcode}</strong> 已存在`; document.getElementById('dupModal').classList.add('show'); return; }
    fillScanBarcode(barcode);
  }
  
  function dupContinue(){ document.getElementById('dupModal').classList.remove('show'); fillScanBarcode(currentDupBarcode); }
  function dupReplace(){ document.getElementById('dupModal').classList.remove('show'); let idx = records.findIndex(r => r.barcodeId === currentDupBarcode); if(idx !== -1) records.splice(idx,1); saveRecords(); sortByTime(); renderAll(); fillScanBarcode(currentDupBarcode); }
  
  function submitInbound() {
    let barcode = document.getElementById('barcodeId').value.trim(); if(!barcode) return showToast("⚠️ 请先扫码或识别标签");
    
    let season = document.getElementById('season').value;
    let seq = document.getElementById('sequenceNo').value.trim();

    let qty = parseFloat(document.getElementById('quantity').value) || 0;
    let price = parseFloat(document.getElementById('price').value) || 0;
    let amount = parseFloat(document.getElementById('amount').value) || 0;

    const record = {
      id: editingIndex !== -1 ? records[editingIndex].id : Date.now(),
      barcodeId: barcode, 
      season: season,
      sequenceNo: seq, 
      size: document.getElementById('size').value,
      bundleNo: document.getElementById('bundleNo').value, 
      styleNo: document.getElementById('styleNo').value,
      quantity: qty, price: price, amount: amount, 
      inboundTime: new Date().toLocaleString('zh-CN')
    };
    if(editingIndex !== -1){ records[editingIndex] = record; editingIndex = -1; showToast("✏️ 修改完成"); }
    else { records.unshift(record); showToast("✅ 入库成功"); }
    saveRecords(); sortByTime(); renderAll();
    document.getElementById('formCard').style.display = 'none'; document.getElementById('scannedBadge').style.display = 'none';
    document.getElementById('barcodeId').value = ''; document.getElementById('price').value = 0; document.getElementById('quantity').value = 1; calcAmount();
    saveCurrentConfig();
    if(isContinuousMode && document.getElementById('keepConfigSwitch').checked){ setTimeout(() => { startScanInternal(); }, 400); }
  }
  
  function clearTodayRecord(){ document.getElementById('todayClearModal').classList.add('show'); }
  function hideTodayClearModal(){ document.getElementById('todayClearModal').classList.remove('show'); }
  function clearToday(){
    let todayCN = getTodayCN(); records = records.filter(r => !r.inboundTime?.includes(todayCN));
    saveRecords(); sortByTime(); renderAll(); hideTodayClearModal(); showToast("✅ 本日记录已清空");
  }

  function modifyRecord(i){ 
    if(html5QrCode) stopScan(true); isContinuousMode=false; let r=records[i]; editingIndex=i; 
    document.getElementById('barcodeId').value=r.barcodeId; 
    document.getElementById('season').value=r.season||'';
    document.getElementById('sequenceNo').value=r.sequenceNo||''; 
    document.getElementById('size').value=r.size||'';
    document.getElementById('bundleNo').value=r.bundleNo||''; 
    document.getElementById('styleNo').value=r.styleNo||'';
    document.getElementById('quantity').value=r.quantity; 
    document.getElementById('price').value=r.price; 
    calcAmount(); document.getElementById('inboundTime').value=r.inboundTime; 
    document.getElementById('scannedBadge').style.display='inline-block'; document.getElementById('formCard').style.display='block'; 
  }
  
  function deleteRecord(i){ if(confirm("删除该条记录？")){ records.splice(i,1); saveRecords(); sortByTime(); renderAll(); showToast("已删除"); } }
  function sortByTime(){ records.sort((a,b)=> new Date(b.inboundTime) - new Date(a.inboundTime)); }
  function saveRecords(){ localStorage.setItem('garment_inbound_records', JSON.stringify(records)); }
  function loadRecords(){ let d=localStorage.getItem('garment_inbound_records'); records=d?JSON.parse(d):[]; sortByTime(); }
  function renderAll(){ renderHistory(); renderStats(); renderMonthSummary(); }
  
  function renderHistory(){
    let container=document.getElementById('history'); document.getElementById('recordCount').innerText=`${records.length}条`;
    if(!records.length){ container.innerHTML='<div class="empty-state">📭 暂无入库记录</div>'; return; }
    container.innerHTML=records.map((r,i)=>`
      <div class="record-item">
        <div class="record-header"><span class="barcode-chip">🔢 ${escapeHtml(r.barcodeId)}</span><span class="time-text">${r.inboundTime}</span></div>
        <div class="detail-grid">
          <div class="detail-tag"><span>季节</span>${r.season||'-'}</div>
          <div class="detail-tag"><span>序号</span>${r.sequenceNo||'-'}</div>
          <div class="detail-tag"><span>款号</span>${r.styleNo||'-'}</div>
          <div class="detail-tag"><span>尺码</span>${r.size||'-'}</div>
          <div class="detail-tag"><span>扎号</span>${r.bundleNo||'-'}</div>
          <div class="detail-tag"><span>数量</span>×${r.quantity}</div>
          <div class="detail-tag"><span>金额</span>¥${r.amount.toFixed(2)}</div>
        </div>
        <div class="record-actions"><button class="btn btn-outline btn-sm" onclick="modifyRecord(${i})">✏️ 修改</button><button class="btn btn-danger btn-sm" onclick="deleteRecord(${i})">🗑️ 删除</button></div>
      </div>
    `).join('');
  }
  
  function renderStats(){
    let total=records.reduce((s,r)=>s+(r.quantity||1),0); let unique=new Set(records.map(r=>r.barcodeId)).size;
    let todayDate=new Date().toLocaleDateString('zh-CN'); let todayQty=records.filter(r=>r.inboundTime?.includes(todayDate)).reduce((s,r)=>s+(r.quantity||1),0);
    document.getElementById('statTotal').textContent=total; document.getElementById('statBarcodes').textContent=unique; document.getElementById('statToday').textContent=todayQty;
  }
  
  function renderMonthSummary(){
    let map=new Map(); records.forEach(r=>{
      let d=new Date(r.inboundTime); let key=`${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}`;
      if(!map.has(key)) map.set(key,{total:0, codes:new Set(), count:0, totalAmount:0});
      let item=map.get(key); item.total+=r.quantity||1; item.codes.add(r.barcodeId); item.count+=1; item.totalAmount += parseFloat(r.amount) || 0;
    });
    let html=''; for(let [k,v] of [...map.entries()].sort().reverse()){
      html+=`<div class="month-summary"><strong>📅 ${k}</strong> 总件数: ${v.total} | 条码: ${v.codes.size} | 单数: ${v.count} | 总金额: ¥${v.totalAmount.toFixed(2)}</div>`;
    }
    document.getElementById('monthSummary').innerHTML=html||'<div class="empty-state">暂无月度数据</div>';
  }
  
  function exportToExcel(){
    if(!records.length) return showToast("无数据导出");
    let detail = records.map(r => ({
      '入库时间': r.inboundTime,
      '季节序号': (r.season||'') + (r.sequenceNo||''),
      '款号': r.styleNo || '',
      '尺码': r.size || '',
      '扎号': r.bundleNo || '',
      '数量': r.quantity || 1,
      '单价(¥)': parseFloat(r.price).toFixed(2),
      '金额(¥)': parseFloat(r.amount).toFixed(2)
    }));
    let totalQty = records.reduce((sum, r) => sum + (r.quantity || 1), 0);
    let totalMoney = records.reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
    let totalOrder = records.length;
    let totalCode = new Set(records.map(r=>r.barcodeId)).size;
    let summary = [
      {统计项目:'总入库单数', 数值:totalOrder},
      {统计项目:'总条码种类', 数值:totalCode},
      {统计项目:'总入库数量', 数值:totalQty},
      {统计项目:'总金额(元)', 数值:totalMoney.toFixed(2)}
    ];
    let wb = XLSX.utils.book_new();
    let ws1 = XLSX.utils.json_to_sheet(detail);
    let ws2 = XLSX.utils.json_to_sheet(summary);

    // 强制设置所有单元格居中对齐
    const centerAlign = { alignment: { horizontal: "center", vertical: "center" } };
    // 给表头也加上居中
    const range1 = XLSX.utils.decode_range(ws1['!ref']);
    for(let r = range1.s.r; r <= range1.e.r; r++){
      for(let c = range1.s.c; c <= range1.e.c; c++){
        const cellAddress = XLSX.utils.encode_cell({r,c});
        if(!ws1[cellAddress]) continue;
        ws1[cellAddress].s = centerAlign;
      }
    }
    const range2 = XLSX.utils.decode_range(ws2['!ref']);
    for(let r = range2.s.r; r <= range2.e.r; r++){
      for(let c = range2.s.c; c <= range2.e.c; c++){
        const cellAddress = XLSX.utils.encode_cell({r,c});
        if(!ws2[cellAddress]) continue;
        ws2[cellAddress].s = centerAlign;
      }
    }

    ws1['!cols'] = [
      {wch:22},{wch:12},{wch:12},{wch:10},{wch:10},{wch:8},{wch:10},{wch:10}
    ];
    ws2['!cols'] = [{wch:14},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws1, "入库明细");
    XLSX.utils.book_append_sheet(wb, ws2, "数据汇总");
    XLSX.writeFile(wb, `服装入库_${new Date().toLocaleDateString()}.xlsx`);
    showToast("✅ 导出成功，表格已全部居中");
  }
  
  function showClearModal(){ document.getElementById('clearModal').classList.add('show'); }
  function hideClearModal(){ document.getElementById('clearModal').classList.remove('show'); }
  function clearAll(){ records=[]; saveRecords(); renderAll(); hideClearModal(); showToast("已清空所有数据"); }
  function showToast(msg){ let t=document.createElement('div');t.className='toast';t.innerText=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200); }
  function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m); }
  
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); });
  loadRecords(); bindCalcEvents(); bindStyleEvent(); calcAmount(); renderAll();
</script>
</body>
</html>
