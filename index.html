<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>服装扫码入库系统</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="扫码入库">
  <meta name="theme-color" content="#1e293b">
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #0f172a;
      --text-light: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.02);
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 24px; font-weight: 800; color: var(--primary); }
    .sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 16px; font-size: 14px; font-weight: 600; border: none;
      border-radius: 60px; cursor: pointer; transition: 0.2s; flex: 1;
      background: var(--card); color: var(--text); box-shadow: var(--shadow);
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
    .btn-danger { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); }
    .btn-sm { padding: 8px 14px; font-size: 12px; flex: none; }
    .switch-bar {
      background: var(--card); border-radius: 40px; padding: 8px 18px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .switch-label { font-size: 13px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
    .switch { position: relative; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; border-radius: 34px; transition: 0.2s; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    #reader { width: 100%; border-radius: 24px; overflow: hidden; margin: 8px 0; border: 2px solid var(--primary); display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .scan-status { text-align: center; font-size: 12px; color: var(--text-light); margin: 6px 0; }
    .close-scan { text-align: center; margin: 6px 0; display: none; }

    .card { background: var(--card); border-radius: 28px; padding: 20px; margin: 14px 0; box-shadow: var(--shadow); }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; }
    .form-grid { display: flex; flex-direction: column; gap: 12px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .input-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
    .input-field input, .input-field select { width: 100%; padding: 12px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 16px; background: white; transition: 0.2s; }
    .input-field input:focus, .input-field select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .input-field input[readonly] { background: #f1f5f9; color: #334155; }

    .stats-grid { display: flex; gap: 12px; margin: 16px 0; }
    .stat-block { flex: 1; background: var(--card); padding: 14px; border-radius: 24px; text-align: center; box-shadow: var(--shadow); }
    .stat-number { font-size: 28px; font-weight: 800; color: var(--primary); }
    .section-header { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 12px; }
    .record-item { background: var(--card); border-radius: 20px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .barcode-chip { font-family: monospace; background: #eef2ff; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: 700; color: var(--primary); }
    .time-text { font-size: 10px; color: #94a3b8; }
    .detail-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .detail-tag { background: #f8fafc; padding: 5px 10px; border-radius: 14px; font-size: 11px; }
    .detail-tag span:first-child { color: var(--text-light); margin-right: 6px; }
    .record-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .empty-state { text-align: center; padding: 48px 20px; color: #94a3b8; }
    .month-summary { background: #f1f5f9; border-radius: 18px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: white; padding: 10px 20px; border-radius: 40px;
      font-size: 13px; font-weight: 500; z-index: 1100;
      animation: fadeOutUp 2.2s forwards; white-space: nowrap;
    }
    @keyframes fadeOutUp {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    .modal-mask { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
    .modal-mask.show { display: flex; }
    .modal-box { background: white; width: 300px; border-radius: 32px; padding: 24px; text-align: center; }
    .ocr-loading { position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 60px; z-index: 1200; font-size: 14px; }
    .retry-btn { margin-left: 8px; padding: 2px 8px; font-size: 10px; background: var(--warning); color: white; border-radius: 20px; cursor: pointer; }
    #ocrFileInput, #ocrRetakeInput { display: none; }
  </style>
</head>
<body>

<div class="header">
  <h1>📦 服装扫码入库系统</h1>
  <div class="sub">扫码入库 | 标签识别 | 数据管理</div>
</div>

<div class="btn-group">
  <button class="btn btn-primary" onclick="startScan()" id="scanBtn">📷 扫码入库</button>
  <button class="btn btn-success" onclick="triggerOCRUpload()">📸 拍照识别标签</button>
  <button class="btn btn-warning" onclick="exportToExcel()">📎 导出报表</button>
</div>
<input type="file" id="ocrFileInput" accept="image/*" capture="environment" onchange="handleOCRImage(event)">
<input type="file" id="ocrRetakeInput" accept="image/*" capture="environment" onchange="handleOCRImage(event)">

<div class="switch-bar">
  <div class="switch-label">⚙️ 连续扫码智能沿用配置 + 序号自动递增</div>
  <label class="switch"><input type="checkbox" id="keepConfigSwitch" checked><span class="slider"></span></label>
</div>

<div class="scan-status" id="scanStatus"></div>
<div class="close-scan" id="closeScanArea">
  <button class="btn btn-outline btn-sm" onclick="stopScan(true)">✕ 关闭扫码器</button>
</div>
<div id="reader"></div>

<!-- 入库表单 -->
<div class="card" id="formCard" style="display:none;">
  <div class="card-title">
    📝 入库明细
    <span class="badge" id="scannedBadge" style="display:none;">✓ 已识别</span>
  </div>
  <div class="form-grid">
    <div class="input-field"><label>🔖 条码ID</label><input type="text" id="barcodeId" readonly placeholder="扫码/识别后自动填充"></div>
    <div class="row-2">
      <div class="input-field"><label>📋 序号</label><select id="sequenceNo"></select></div>
      <div class="input-field"><label>📏 尺码</label><select id="size"><option value="">请选择</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>2XL</option><option>3XL</option><option>4XL</option><option>5XL</option></select></div>
    </div>
    <div class="row-3">
      <div class="input-field"><label>🏷️ 扎号</label><input type="text" id="bundleNo" placeholder="捆号/扎号"></div>
      <div class="input-field"><label>📦 批号</label><input type="text" id="batchNo" placeholder="批号"></div>
      <div class="input-field"><label>👔 款号</label><input type="text" id="styleNo" placeholder="款号"></div>
    </div>
    <div class="row-2">
      <div class="input-field"><label>🎨 色号</label><input type="text" id="colorCode" placeholder="例: 02-269"></div>
      <div class="input-field"><label>🖌️ 颜色</label><input type="text" id="colorName" placeholder="例: 花灰"></div>
    </div>
    <div class="input-field"><label>🧵 A料信息</label><input type="text" id="fabricA" placeholder="面料/辅料信息"></div>
    <div class="input-field"><label>🧵 B料信息</label><input type="text" id="fabricB" placeholder="辅料B (选填)"></div>
    <div class="row-2">
      <div class="input-field"><label>📊 数量</label><input type="number" id="quantity" value="1" min="1"></div>
      <div class="input-field"><label>⏱️ 入库时间</label><input type="text" id="inboundTime" readonly></div>
    </div>
    <button class="btn btn-primary" onclick="submitInbound()" style="margin-top: 4px;">✅ 确认入库</button>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-block"><div class="stat-number" id="statTotal">0</div><div>总件数</div></div>
  <div class="stat-block"><div class="stat-number" id="statBarcodes">0</div><div>唯一条码</div></div>
  <div class="stat-block"><div class="stat-number" id="statToday">0</div><div>今日入库</div></div>
</div>

<div class="section-header"><h3>📅 月度汇总</h3><span style="font-size:12px">按月份统计</span></div>
<div id="monthSummary" class="card" style="padding: 12px;"></div>

<div class="section-header"><h3>📋 入库记录</h3><span id="recordCount">0 条</span></div>
<div id="history"></div>

<div style="display:flex; gap:12px; margin-top: 12px;">
  <button class="btn btn-warning" onclick="exportToExcel()" style="flex:1;">📥 导出 Excel</button>
  <button class="btn btn-danger" onclick="showClearModal()" style="flex:1;">🗑️ 清空记录</button>
</div>

<!-- 弹窗 -->
<div class="modal-mask" id="clearModal"><div class="modal-box"><h4>⚠️ 确认清空</h4><p>所有入库数据将永久删除，建议先导出备份。</p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="hideClearModal()">取消</button><button class="btn btn-danger btn-sm" onclick="clearAll()">确认清空</button></div></div></div>
<div class="modal-mask" id="dupModal"><div class="modal-box"><h4>⚠️ 条码重复</h4><p id="dupMsg"></p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-success btn-sm" onclick="dupContinue()">继续新增</button><button class="btn btn-primary btn-sm" onclick="dupReplace()">覆盖数据</button></div></div></div>
<div class="modal-mask" id="ocrRetryModal"><div class="modal-box"><h4>📸 识别结果不理想</h4><p id="ocrRetryMsg">识别内容较少，是否重新拍照？</p><div class="btn-group" style="margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="closeRetryModal()">使用当前结果</button><button class="btn btn-primary btn-sm" onclick="retakePhoto()">重新拍照</button></div></div></div>

<script>
  // ==================== 全局变量 ====================
  let html5QrCode = null;
  let records = [];
  let editingIndex = -1;
  let lastConfig = {};
  let isContinuousMode = false;
  let currentDupBarcode = '';
  let dailySeqMap = {};
  let ocrWorker = null;           // 预加载的OCR工作线程
  let lastOCRData = null;         // 上一次OCR识别结果缓存

  // ==================== 初始化 & 预加载OCR ====================
  (async function preloadOCR() {
    try {
      ocrWorker = await Tesseract.createWorker();
      await ocrWorker.loadLanguage('eng+chi_sim');
      await ocrWorker.initialize('eng+chi_sim');
      console.log('OCR引擎预加载完成');
    } catch(e) { console.warn('OCR预加载失败', e); }
  })();

  // ==================== 辅助函数 ====================
  const getTodayStr = () => new Date().toISOString().slice(0,10);
  
  function rebuildDailySeqMap() {
    dailySeqMap = {};
    records.forEach(r => {
      if (r.sequenceNo && r.inboundTime) {
        let d = r.inboundTime.split(' ')[0].replace(/\//g, '-');
        let parts = d.split('-');
        if(parts.length===3){
          let norm = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
          let seq = parseInt(r.sequenceNo,10);
          if(!isNaN(seq)) dailySeqMap[norm] = Math.max(dailySeqMap[norm]||0, seq);
        }
      }
    });
  }
  
  function getNextSequence() {
    let today = getTodayStr();
    let max = dailySeqMap[today] || 0;
    records.forEach(r => {
      if(r.inboundTime && r.sequenceNo){
        let d = r.inboundTime.split(' ')[0].replace(/\//g, '-');
        if(d === today) max = Math.max(max, parseInt(r.sequenceNo,10)||0);
      }
    });
    return Math.min(max+1, 999);
  }
  
  function refreshSeqSelect() {
    let sel = document.getElementById('sequenceNo');
    if(!sel) return;
    if(editingIndex !== -1 && document.getElementById('barcodeId').value) return;
    let nxt = getNextSequence();
    sel.value = nxt;
    if(lastConfig) lastConfig.sequenceNo = sel.value;
  }
  
  function initSequenceSelect() {
    let sel = document.getElementById('sequenceNo');
    sel.innerHTML = '';
    for(let i=1;i<=999;i++){ let opt = document.createElement('option'); opt.value=i; opt.textContent=i; sel.appendChild(opt); }
    refreshSeqSelect();
  }

  // 保存配置
  function saveCurrentConfig() {
    lastConfig = {
      sequenceNo: document.getElementById('sequenceNo').value,
      size: document.getElementById('size').value,
      bundleNo: document.getElementById('bundleNo').value,
      batchNo: document.getElementById('batchNo').value,
      styleNo: document.getElementById('styleNo').value,
      colorCode: document.getElementById('colorCode').value,
      colorName: document.getElementById('colorName').value,
      fabricA: document.getElementById('fabricA').value,
      fabricB: document.getElementById('fabricB').value,
      quantity: document.getElementById('quantity').value
    };
  }
  
  function applyLastConfigContinuous() {
    if(!document.getElementById('keepConfigSwitch').checked) return;
    const fields = ['size','bundleNo','batchNo','styleNo','colorCode','colorName','fabricA','fabricB','quantity'];
    fields.forEach(k => { let el = document.getElementById(k); if(el && lastConfig[k] !== undefined) el.value = lastConfig[k]; });
    let newSeq = getNextSequence();
    document.getElementById('sequenceNo').value = newSeq;
    lastConfig.sequenceNo = newSeq;
  }

  // ==================== OCR 标签识别 (增强版) ====================
  function triggerOCRUpload() { document.getElementById('ocrFileInput').click(); }
  function retakePhoto() { 
    closeRetryModal(); 
    document.getElementById('ocrRetakeInput').click(); 
  }
  function closeRetryModal() { document.getElementById('ocrRetryModal').classList.remove('show'); }
  
  // 图像预处理：转为灰度+二值化，提升识别率
  async function preprocessImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const gray = data[i] * 0.3 + data[i+1] * 0.59 + data[i+2] * 0.11;
          const value = gray > 140 ? 255 : 0;  // 二值化阈值可调节
          data[i] = data[i+1] = data[i+2] = value;
        }
        ctx.putImageData(imageData, 0, 0);
        canvas.toBlob(resolve, 'image/png');
      };
      img.src = URL.createObjectURL(file);
    });
  }

  async function handleOCRImage(event) {
    const file = event.target.files[0];
    if(!file) return;
    showToast("🔍 AI识别中，请稍候...");
    let loadingDiv = document.createElement('div');
    loadingDiv.className = 'ocr-loading';
    loadingDiv.innerText = '📖 正在识别服装标签...';
    document.body.appendChild(loadingDiv);
    try {
      // 预处理图片提升识别率
      const processedBlob = await preprocessImage(file);
      const result = await Tesseract.recognize(processedBlob, 'chi_sim+eng', {
        logger: m => console.log(m)
      });
      const rawText = result.data.text;
      console.log("OCR识别结果:\n", rawText);
      const parsed = parseGarmentLabel(rawText);
      lastOCRData = parsed;
      
      // 检查识别质量：如果条码和关键字段都为空，提示重拍
      if(!parsed.barcodeId && !parsed.styleNo && !parsed.size) {
        document.getElementById('ocrRetryMsg').innerHTML = '识别内容较少，请确保标签清晰、光线充足、正对拍摄。是否重新拍照？';
        document.getElementById('ocrRetryModal').classList.add('show');
        return;
      }
      fillFromOCRData(parsed);
      showToast("✅ 标签识别成功，已自动填充表单");
    } catch(err) {
      console.error(err);
      showToast("❌ 识别失败，请确保标签清晰并重试");
    } finally {
      document.body.removeChild(loadingDiv);
      document.getElementById('ocrFileInput').value = '';
      document.getElementById('ocrRetakeInput').value = '';
    }
  }

  // 智能解析服装标签（支持多种格式）
  function parseGarmentLabel(text) {
    let result = { barcodeId: '', size: '', bundleNo: '', batchNo: '', styleNo: '', colorCode: '', colorName: '', fabricA: '', fabricB: '' };
    // 条码：8-20位数字
    let barcodeMatch = text.match(/\b(\d{8,20})\b/);
    if(barcodeMatch) result.barcodeId = barcodeMatch[1];
    // 尺码
    let sizeMatch = text.match(/\b(XS|S|M|L|XL|2XL|3XL|4XL|XXL|XXXL)\b/i);
    if(sizeMatch) result.size = sizeMatch[1].toUpperCase();
    // 扎号/捆号
    let bundleMatch = text.match(/(?:扎号|捆号|扎)[:：]?\s*([^\n\r,，]+)/i);
    if(bundleMatch) result.bundleNo = bundleMatch[1].trim();
    // 批号
    let batchMatch = text.match(/(?:批号|批次|批)[:：]?\s*([^\n\r,，]+)/i);
    if(batchMatch) result.batchNo = batchMatch[1].trim();
    // 款号
    let styleMatch = text.match(/(?:款号|款|货号)[:：]?\s*([A-Z0-9\-]+)/i);
    if(styleMatch) result.styleNo = styleMatch[1].trim();
    // 色号
    let colorCodeMatch = text.match(/(?:色号|色码|色)[:：]?\s*([\w\-]+)/i);
    if(colorCodeMatch) result.colorCode = colorCodeMatch[1].trim();
    // 颜色名称（中文）
    let colorNameMatch = text.match(/(?:颜色|色名)[:：]?\s*([\u4e00-\u9fa5]{2,6})/i);
    if(colorNameMatch) result.colorName = colorNameMatch[1].trim();
    // 组合提取：如 "02-269 花灰"
    let combined = text.match(/([\w\-]+)\s+([\u4e00-\u9fa5]{2,4})/);
    if(combined && !result.colorCode) result.colorCode = combined[1];
    if(combined && !result.colorName) result.colorName = combined[2];
    // 面料信息
    let fabricAMatch = text.match(/(?:A料|面料A|A面)[:：]?\s*([^\n]{2,30})/i);
    if(fabricAMatch) result.fabricA = fabricAMatch[1].trim();
    let fabricBMatch = text.match(/(?:B料|面料B|B面)[:：]?\s*([^\n]{2,30})/i);
    if(fabricBMatch) result.fabricB = fabricBMatch[1].trim();
    return result;
  }

  function fillFromOCRData(data) {
    if(data.barcodeId) document.getElementById('barcodeId').value = data.barcodeId;
    if(data.size) {
      let sizeSel = document.getElementById('size');
      for(let opt of sizeSel.options) if(opt.value === data.size) { opt.selected = true; break; }
    }
    document.getElementById('bundleNo').value = data.bundleNo || '';
    document.getElementById('batchNo').value = data.batchNo || '';
    document.getElementById('styleNo').value = data.styleNo || '';
    document.getElementById('colorCode').value = data.colorCode || '';
    document.getElementById('colorName').value = data.colorName || '';
    document.getElementById('fabricA').value = data.fabricA || '';
    document.getElementById('fabricB').value = data.fabricB || '';
    document.getElementById('quantity').value = 1;
    document.getElementById('inboundTime').value = new Date().toLocaleString('zh-CN');
    document.getElementById('scannedBadge').style.display = 'inline-block';
    refreshSeqSelect();
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
  }

  // ==================== 扫码逻辑 ====================
  function fillScanBarcode(barcode){
    document.getElementById('barcodeId').value = barcode;
    document.getElementById('scannedBadge').style.display = 'inline-block';
    document.getElementById('inboundTime').value = new Date().toLocaleString('zh-CN');
    editingIndex = -1;
    if(isContinuousMode && document.getElementById('keepConfigSwitch').checked){
      applyLastConfigContinuous();
    } else {
      refreshSeqSelect();
      if(lastConfig && document.getElementById('keepConfigSwitch').checked){
        const keep = ['size','bundleNo','batchNo','styleNo','colorCode','colorName','fabricA','fabricB','quantity'];
        keep.forEach(k => { let el = document.getElementById(k); if(el && lastConfig[k]!==undefined) el.value = lastConfig[k]; });
      }
    }
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('formCard').scrollIntoView({behavior:'smooth'});
    if(navigator.vibrate) navigator.vibrate(50);
    showToast("✅ 扫码成功");
  }
  
  async function stopCameraOnly() {
    if(html5QrCode){
      try{ await html5QrCode.stop(); }catch(e){}
      html5QrCode = null;
    }
    document.getElementById('reader').style.display = 'none';
    document.getElementById('scanBtn').style.display = 'block';
    document.getElementById('closeScanArea').style.display = 'none';
    document.getElementById('scanStatus').textContent = '';
  }
  
  function stopScan(resetContinuous = true) {
    if(resetContinuous) isContinuousMode = false;
    if(html5QrCode){
      try{ html5QrCode.stop(); }catch(e){}
      html5QrCode = null;
    }
    document.getElementById('reader').style.display = 'none';
    document.getElementById('scanBtn').style.display = 'block';
    document.getElementById('closeScanArea').style.display = 'none';
    document.getElementById('scanStatus').textContent = '';
  }
  
  async function startScan() {
    if(html5QrCode) try{ await html5QrCode.stop(); }catch(e){}
    document.getElementById('reader').innerHTML = '';
    document.getElementById('reader').style.display = 'block';
    document.getElementById('scanBtn').style.display = 'none';
    document.getElementById('closeScanArea').style.display = 'block';
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('scanStatus').textContent = '📷 请求摄像头...';
    html5QrCode = new Html5Qrcode("reader");
    try {
      await html5QrCode.start({ facingMode:"environment" }, { fps:10, qrbox:{width:280,height:200} }, onScanSuccess, ()=>{});
      document.getElementById('scanStatus').textContent = '🔍 扫描中，对准条码';
    } catch(e){
      console.error(e);
      showToast("❌ 摄像头启动失败, 请检查权限");
      stopScan(true);
    }
  }
  
  async function onScanSuccess(text) {
    await stopCameraOnly();
    let barcode = text.trim();
    currentDupBarcode = barcode;
    let exist = records.findIndex(r => r.barcodeId === barcode);
    if(exist !== -1){
      document.getElementById('dupMsg').innerHTML = `条码 <strong>${barcode}</strong> 已存在，请选择`;
      document.getElementById('dupModal').classList.add('show');
      return;
    }
    fillScanBarcode(barcode);
  }
  
  function startContinuousScan() {
    isContinuousMode = true;
    editingIndex = -1;
    showToast('🔄 连续扫码模式开启 · 序号自动递增');
    startScan();
  }
  
  function dupContinue(){
    document.getElementById('dupModal').classList.remove('show');
    fillScanBarcode(currentDupBarcode);
    showToast("📥 继续新增入库");
  }
  
  function dupReplace(){
    document.getElementById('dupModal').classList.remove('show');
    let idx = records.findIndex(r => r.barcodeId === currentDupBarcode);
    if(idx !== -1) records.splice(idx,1);
    saveRecords(); rebuildDailySeqMap(); sortByTime(); renderAll();
    fillScanBarcode(currentDupBarcode);
    showToast("🔄 覆盖原记录");
  }
  
  // ==================== 提交入库 ====================
  function submitInbound() {
    let barcode = document.getElementById('barcodeId').value.trim();
    if(!barcode) return showToast("⚠️ 请先扫码或识别标签");
    let seq = document.getElementById('sequenceNo').value;
    if(!seq) seq = getNextSequence().toString();
    let today = getTodayStr();
    let conflict = records.some(r => {
      if(editingIndex !== -1 && r.id === records[editingIndex]?.id) return false;
      let d = r.inboundTime?.split(' ')[0]?.replace(/\//g, '-');
      return d === today && r.sequenceNo === seq;
    });
    if(conflict && editingIndex === -1){
      seq = getNextSequence().toString();
      document.getElementById('sequenceNo').value = seq;
      showToast("📌 序号冲突，已自动修正");
    }
    const record = {
      id: editingIndex !== -1 ? records[editingIndex].id : Date.now(),
      barcodeId: barcode,
      sequenceNo: seq,
      size: document.getElementById('size').value,
      bundleNo: document.getElementById('bundleNo').value,
      batchNo: document.getElementById('batchNo').value,
      styleNo: document.getElementById('styleNo').value,
      colorCode: document.getElementById('colorCode').value,
      colorName: document.getElementById('colorName').value,
      fabricA: document.getElementById('fabricA').value,
      fabricB: document.getElementById('fabricB').value,
      quantity: parseInt(document.getElementById('quantity').value)||1,
      inboundTime: new Date().toLocaleString('zh-CN')
    };
    if(editingIndex !== -1){
      records[editingIndex] = record;
      editingIndex = -1;
      showToast("✏️ 修改完成");
    } else {
      records.unshift(record);
      showToast("✅ 入库成功");
    }
    saveRecords(); rebuildDailySeqMap(); sortByTime(); renderAll();
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('scannedBadge').style.display = 'none';
    document.getElementById('barcodeId').value = '';
    saveCurrentConfig();
    
    if(isContinuousMode && document.getElementById('keepConfigSwitch').checked){
      setTimeout(() => { startScan(); }, 300);
    } else {
      isContinuousMode = false;
    }
  }
  
  // ==================== 增删改查 & 渲染 ====================
  function modifyRecord(i){ 
    if(html5QrCode) stopScan(true); 
    isContinuousMode=false; 
    let r=records[i]; 
    editingIndex=i; 
    document.getElementById('barcodeId').value=r.barcodeId; 
    document.getElementById('sequenceNo').value=r.sequenceNo; 
    document.getElementById('size').value=r.size; 
    document.getElementById('bundleNo').value=r.bundleNo; 
    document.getElementById('batchNo').value=r.batchNo; 
    document.getElementById('styleNo').value=r.styleNo; 
    document.getElementById('colorCode').value=r.colorCode; 
    document.getElementById('colorName').value=r.colorName; 
    document.getElementById('fabricA').value=r.fabricA; 
    document.getElementById('fabricB').value=r.fabricB; 
    document.getElementById('quantity').value=r.quantity; 
    document.getElementById('inboundTime').value=r.inboundTime; 
    document.getElementById('scannedBadge').style.display='inline-block'; 
    document.getElementById('formCard').style.display='block'; 
    showToast("✏️ 编辑模式"); 
  }
  
  function deleteRecord(i){ if(confirm("删除该条记录？")){ records.splice(i,1); saveRecords(); rebuildDailySeqMap(); sortByTime(); renderAll(); showToast("已删除"); } }
  function sortByTime(){ records.sort((a,b)=> new Date(b.inboundTime) - new Date(a.inboundTime)); }
  function saveRecords(){ localStorage.setItem('garment_inbound_records', JSON.stringify(records)); }
  function loadRecords(){ let d=localStorage.getItem('garment_inbound_records'); records=d?JSON.parse(d):[]; rebuildDailySeqMap(); sortByTime(); }
  function renderAll(){ renderHistory(); renderStats(); renderMonthSummary(); }
  
  function renderHistory(){
    let container=document.getElementById('history');
    document.getElementById('recordCount').innerText=`${records.length}条`;
    if(!records.length){ container.innerHTML='<div class="empty-state">📭 暂无入库记录，请扫码或识别标签</div>'; return; }
    container.innerHTML=records.map((r,i)=>`
      <div class="record-item">
        <div class="record-header"><span class="barcode-chip">🔢 ${escapeHtml(r.barcodeId)}</span><span class="time-text">${r.inboundTime}</span></div>
        <div class="detail-grid">
          <div class="detail-tag"><span>序号</span> ${r.sequenceNo}</div>
          <div class="detail-tag"><span>尺码</span> ${r.size||'-'}</div>
          <div class="detail-tag"><span>款号</span> ${r.styleNo||'-'}</div>
          <div class="detail-tag"><span>色号/色</span> ${r.colorCode||''} ${r.colorName||''}</div>
          <div class="detail-tag"><span>扎/批</span> ${r.bundleNo||'-'} / ${r.batchNo||'-'}</div>
          <div class="detail-tag"><span>数量</span> ×${r.quantity}</div>
        </div>
        <div class="record-actions"><button class="btn btn-outline btn-sm" onclick="modifyRecord(${i})">✏️ 修改</button><button class="btn btn-danger btn-sm" onclick="deleteRecord(${i})">🗑️ 删除</button></div>
      </div>
    `).join('');
  }
  
  function renderStats(){
    let total=records.reduce((s,r)=>s+(r.quantity||1),0);
    let unique=new Set(records.map(r=>r.barcodeId)).size;
    let todayDate=new Date().toLocaleDateString('zh-CN');
    let todayQty=records.filter(r=>r.inboundTime?.includes(todayDate)).reduce((s,r)=>s+(r.quantity||1),0);
    document.getElementById('statTotal').textContent=total;
    document.getElementById('statBarcodes').textContent=unique;
    document.getElementById('statToday').textContent=todayQty;
  }
  
  function renderMonthSummary(){
    let map=new Map();
    records.forEach(r=>{
      let d=new Date(r.inboundTime);
      let key=`${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}`;
      if(!map.has(key)) map.set(key,{total:0, codes:new Set(), count:0});
      let item=map.get(key);
      item.total+=r.quantity||1;
      item.codes.add(r.barcodeId);
      item.count+=1;
    });
    let html='';
    for(let [k,v] of [...map.entries()].sort().reverse()){
      html+=`<div class="month-summary"><strong>📅 ${k}</strong> &nbsp; 总件数: ${v.total} &nbsp; 条码数: ${v.codes.size} &nbsp; 单数: ${v.count}</div>`;
    }
    document.getElementById('monthSummary').innerHTML=html||'<div class="empty-state">暂无月度数据</div>';
  }
  
  function exportToExcel(){
    if(!records.length) return showToast("无数据导出");
    let detail=records.map(r=>({'条码ID':r.barcodeId,'序号':r.sequenceNo,'尺码':r.size,'扎号':r.bundleNo,'批号':r.batchNo,'款号':r.styleNo,'色号':r.colorCode,'颜色':r.colorName,'A料':r.fabricA,'B料':r.fabricB,'数量':r.quantity,'入库时间':r.inboundTime}));
    let wb=XLSX.utils.book_new();
    let ws=XLSX.utils.json_to_sheet(detail);
    XLSX.utils.book_append_sheet(wb,ws,"入库明细");
    XLSX.writeFile(wb,`服装入库_${new Date().toLocaleDateString()}.xlsx`);
    showToast("导出成功");
  }
  
  function showClearModal(){ document.getElementById('clearModal').classList.add('show'); }
  function hideClearModal(){ document.getElementById('clearModal').classList.remove('show'); }
  function clearAll(){ records=[]; saveRecords(); rebuildDailySeqMap(); renderAll(); hideClearModal(); showToast("已清空所有数据"); }
  function showToast(msg){ let t=document.createElement('div');t.className='toast';t.innerText=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200); }
  function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  
  // ==================== 启动 ====================
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); });
  loadRecords(); initSequenceSelect(); renderAll();
</script>
</body>
</html>
